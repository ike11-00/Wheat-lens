# ---------------------------------------------------------------------------
# Leaf Lens - model V2: the background-confound experiment
#
# Only the keys that differ from config/config.yaml; deep-merged on top of it.
#
#     python -m src.data.prepare_dataset                              # split first
#     python -m src.data.augment_backgrounds --config config/model_v2.yaml
#     python -m src.data.augment_backgrounds --verify                 # leakage check
#     python -m src.model.train    --config config/model_v2.yaml
#     python -m src.model.evaluate --config config/model_v2.yaml
#     python -m src.testing.background_robustness --version v2
#     python -m src.model.compare_models v1 v2
#
# WHAT THIS TESTS
# ---------------
# v1 learned "field background => Yellow Rust", because three of its four
# classes are studio photographs and the fourth is field photography. This
# variant gives the studio classes varied backgrounds so that background stops
# carrying class information, and asks whether the model then relies on the
# leaf instead.
#
# The measurement that matters is NOT test accuracy - v1 already scores 100%
# there. It is background robustness: accuracy on test images whose backgrounds
# have been replaced. v1 scores about 16% on that. See docs/v2_experiment.md.
#
# This is an experiment with an expected-to-be-partial result, not a fix. The
# limitations are documented; read them before quoting any number from it.
# ---------------------------------------------------------------------------

model:
  version: "v2"

data:
  background_augmentation:
    enabled: true
    # The three studio classes. Yellow Rust is deliberately absent: it already
    # has varied real backgrounds, and augmenting it would not break anything.
    classes: ["Healthy", "Brown Rust", "Powdery Mildew"]
    # Reuse the real field backgrounds the model was keying on. Harvested from
    # the TRAINING split only, never validation or test.
    harvest_from: "Yellow Rust"
    background_sources: ["harvested", "procedural"]
    copies_per_image: 1
    seed: 42
    leaf_scale: [0.45, 0.95]
    brightness_threshold: 0.70
    saturation_threshold: 0.35
    min_leaf_fraction: 0.04
    jpeg_quality: 92
